[project]
name = "vietdist-analytics-platform"
version = "0.1.0"
description = "Data Lakehouse (Bronze → Silver → Gold) cho nhà phân phối FMCG — ELT pipeline tự động hóa 10 nguồn dữ liệu thô → Star Schema, phục vụ DuckDB ad-hoc SQL và Power BI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastexcel>=0.20.2",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "polars>=1.43.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "xlsxwriter>=3.2.9",
]
