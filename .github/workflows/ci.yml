name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        continue-on-error: true # placeholder job — repo not ruff-clean yet, don't hard-fail CI
        run: uvx ruff check .

      - name: Test (placeholder)
        run: echo "No tests yet — placeholder step, replace with 'uv run pytest' once test_pipeline.py exists"
